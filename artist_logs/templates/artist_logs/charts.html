{% extends 'artist_logs/base.html' %}

{% block extra_js %}
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Royalty Payable by Composer</h2>
    </div>

    <!-- Filter Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form method="get">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" name="composer" class="form-control"
                               placeholder="Filter by Composer" value="{{ composer_filter }}">
                    </div>
                    <div class="col-md-4">
                        <input type="text" name="song_title" class="form-control"
                               placeholder="Filter by Song Title" value="{{ song_title_filter }}">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Search</button>
                    </div>
                    <div class="col-md-2">
                        <a href="{% url 'artist_logs:charts' %}" class="btn btn-secondary w-100">Clear Filters</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Chart Container -->
    <div class="card shadow-sm">
        <div class="card-body">
            {{ chart|safe }}
        </div>
    </div>
</div>
{% endblock %}
