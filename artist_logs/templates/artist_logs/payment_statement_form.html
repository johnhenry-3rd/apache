{% extends 'artist_logs/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-gold mb-4">Create Payment Statement</h1>

    <form method="post" class="bg-dark p-4 rounded">
        {% csrf_token %}

        <div class="mb-3">
            <label for="statement_number" class="form-label text-light">Statement Number</label>
            <input type="text" class="form-control" id="statement_number" name="statement_number" required>
        </div>

        <div class="mb-3">
            <label for="statement_date" class="form-label text-light">Statement Date</label>
            <input type="date" class="form-control" id="statement_date" name="statement_date" required>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="start_period" class="form-label text-light">Start Period</label>
                <input type="text" class="form-control" id="start_period" name="start_period" placeholder="e.g., 202604" required>
            </div>
            <div class="col-md-6">
                <label for="end_period" class="form-label text-light">End Period</label>
                <input type="text" class="form-control" id="end_period" name="end_period" placeholder="e.g., 202606" required>
            </div>
        </div>

        <div class="mb-3">
            <label for="total_amount" class="form-label text-light">Total Amount (£)</label>
            <input type="number" step="0.01" class="form-control" id="total_amount" name="total_amount" required>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label text-light">Status</label>
            <select class="form-select" id="status" name="status" required>
                <option value="draft">Draft</option>
                <option value="finalized">Finalized</option>
                <option value="paid">Paid</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="notes" class="form-label text-light">Notes</label>
            <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-gold">
            <i class="fas fa-save"></i> Create Payment Statement
        </button>
        <a href="{% url 'artist_logs:payment_statement_list' %}" class="btn btn-outline-secondary">
            <i class="fas fa-times"></i> Cancel
        </a>
    </form>
</div>
{% endblock %}
