{% extends 'artist_logs/base.html' %}

{% block content %}
<div class="login-container">
    <h2>Login to Artist Logs</h2>
    <form method="post" class="login-form">
        {% csrf_token %}

        {% if form.errors %}
            <div class="alert alert-error">
                Invalid username or password
            </div>
        {% endif %}

        <div class="form-group">
            <label for="id_username">Username:</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label for="id_password">Password:</label>
            {{ form.password }}
        </div>

        <div class="form-actions">
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary">Login</button>
        </div>
    </form>

    <div class="login-links">
        <a href="{% url 'password_reset' %}">Forgot password?</a>
    </div>
</div>

<style>
    .login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background: #f9f9f9;
    }
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .form-group input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
    }
    .btn {
        padding: 10px 15px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    .alert {
        padding: 10px;
        margin-bottom: 15px;
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        border-radius: 4px;
    }
</style>
{% endblock %}
